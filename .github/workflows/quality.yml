name: Test and build
on:
  push:
    branches: [main, fix/ios-secret-screen-lifecycle]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Report dependency audit
        run: |
          npm audit --json > npm-audit.json || true
          npm ls --depth=0 || true
          node -e 'const a=require("./npm-audit.json"); console.log("Dependency audit:", JSON.stringify(a.metadata?.vulnerabilities)); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name, v.severity, "range=" + v.range, "via=" + JSON.stringify(v.via.map(x => typeof x === "string" ? x : {title:x.title,range:x.range,url:x.url})), "fix=" + JSON.stringify(v.fixAvailable));'
      - run: npm run build
      - run: npm test
