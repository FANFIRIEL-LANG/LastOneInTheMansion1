name: iOS project build
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    branches: [main, fix/ios-secret-screen-lifecycle]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: mansion-ios-simulator-build
          path: build/ios/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
      - name: Build unsigned iPhone app
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/ios-device CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios-device/Build/Products/Release-iphoneos/App.app build/ipa/Payload/App.app
          cd build/ipa
          /usr/bin/zip -r ../../mansion-unsigned-iphone.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: mansion-unsigned-iphone-ipa
          path: mansion-unsigned-iphone.ipa
          if-no-files-found: error
