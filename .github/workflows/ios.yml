name: iOS project build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm install
      - run: npm run build
      - run: npx cap add ios
      - run: npx cap sync ios
      - uses: actions/upload-artifact@v4
        with:
          name: mansion-ios-xcode-project
          path: ios/
          if-no-files-found: error